<th:block th:fragment="content">

    <!-- Header -->
    <section class="section bg-redbrown bg-red-gradient py-5 position-relative d-flex align-items-center overflow-hidden"
             th:style="${section.info5 != null and !section.info5.isEmpty() and section.info5 != '0'} ? 'background-image: url(' + ${config.imagesRepositoryWeb} + ${section.info5} + '); background-size: cover; background-position: center;' : ''">
        <div class="green-square-forms">
            <svg width="100%" height="100%" viewBox="0 0 726 360" version="1.1" xmlns="http://www.w3.org/2000/svg"
                 xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/"
                 style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
                <g id="Group" opacity="0.32">
                    <path d="M627.751,245.625l-396.368,-193.321l-193.322,396.368l396.368,193.321l193.322,-396.368Z" style="fill:url(#_Linear1);" />
                    <path d="M583.359,-179.506l-264.865,159.147l159.147,264.865l264.865,-159.147l-159.147,-264.865Z" style="fill:url(#_Linear2);" />
                    <path d="M210.182,-54.565l-213.341,33.79l33.79,213.34l213.341,-33.79l-33.79,-213.34Z" style="fill:url(#_Linear3);" />
                </g>
                <defs>
                    <linearGradient id="_Linear1" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="matrix(203.046,589.69,-589.69,203.046,231.383,52.3035)">
                        <stop offset="0" style="stop-color:#0f842e;stop-opacity:1" />
                        <stop offset="1" style="stop-color:#00838f;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="_Linear2" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="matrix(344.438,-26.7144,26.7144,344.438,398.068,112.073)">
                        <stop offset="0" style="stop-color:#0e865C;stop-opacity:1" />
                        <stop offset="1" style="stop-color:#00838f;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="_Linear3" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="matrix(230.236,72.8805,-72.8805,230.236,13.7359,85.8949)">
                        <stop offset="0" style="stop-color:#0e865C;stop-opacity:1" />
                        <stop offset="1" style="stop-color:#00838f;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="container">
            <div class="row variable-gutters">
                <div class="col-md-5">
                    <div class="hero-title text-left">
                        <h1 class="p-0 mb-2" th:text="${section.titolo}">Titolo Sezione</h1>
                        <p class="h4 font-weight-normal" th:text="${section.riassunto}">Riassunto</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Carousel primi 6 contenuti -->
    <section class="section section-muted py-2 py-lg-3 py-xl-5"
             th:if="${section.contenuti != null and !section.contenuti.isEmpty()}">
        <div class="container">
            <div class="row variable-gutters">
                <div class="col-lg-12">
                    <div class="it-carousel-wrapper it-carousel-landscape-abstract-three-cols splide" data-bs-carousel-splide>
                        <div class="splide__track">
                            <ul class="splide__list it-carousel-all">
                                <th:block th:each="item, iterStat : ${section.contenuti}" th:if="${iterStat.index < 6}">
                                    <li class="splide__slide">
                                        <div class="it-single-slide-wrapper">
                                            <div class="card-wrapper border border-light rounded shadow-sm cmp-list-card-img cmp-list-card-img-hr">
                                                <div class="card no-after rounded">
                                                    <div class="row g-2 g-md-0 flex-md-column">
                                                        <div class="col order-2 order-md-1">
                                                            <a th:href="${item.url}">
                                                                <img class="rounded-top img-fluid img-responsive"
                                                                     th:src="@{|${config.imagesRepositoryWeb}${item.logo}|}"
                                                                     th:title="${item.titolo}" th:alt="${item.titolo}">
                                                            </a>
                                                        </div>
                                                        <div class="col order-1 order-md-2">
                                                            <div class="card-body">
                                                                <div class="category-top cmp-list-card-img__body">
                                                                    <span class="data" th:text="${item.dataVisualizzata}">Data</span>
                                                                </div>
                                                                <a th:href="${item.url}" class="text-decoration-none">
                                                                    <h3 class="h5 card-title" th:text="${item.titolo}">Titolo</h3>
                                                                </a>
                                                                <p class="card-text d-none d-md-block" th:text="${item.riassunto}">Riassunto</p>
                                                                <a class="read-more" th:href="${item.url}">
                                                                    <span class="text">Leggi di più</span>
                                                                </a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </li>
                                </th:block>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================================
         RICERCA + LISTA CIRCOLARI + PAGINAZIONE
         ============================================================ -->
    <section class="section py-5">
        <div class="container">

            <!-- Barra di ricerca -->
            <div class="row variable-gutters mb-5">
                <div class="col-12">
                    <h2 class="h4 mb-3">Cerca tra le circolari</h2>
                    <div class="row g-3 align-items-end">

                        <div class="col-12 col-md-5">
                            <div class="form-group">
                                <label for="cerca-q" class="active">Parola chiave</label>
                                <input type="text" id="cerca-q" class="form-control"
                                       placeholder="Es. uscita didattica, iscrizioni…"
                                       autocomplete="off"
                                       data-bs-input
                                       th:value="${ricercaQ}">
                                <style>#cerca-q ~ button.clean-input { display: none !important; }</style>
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <div class="form-group">
                                <label for="cerca-dal" class="active">Dal</label>
                                <input type="date" id="cerca-dal" class="form-control" autocomplete="off" th:value="${ricercaDal}">
                            </div>
                        </div>

                        <div class="col-6 col-md-2">
                            <div class="form-group">
                                <label for="cerca-al" class="active">Al</label>
                                <input type="date" id="cerca-al" class="form-control" autocomplete="off" th:value="${ricercaAl}">
                            </div>
                        </div>

                        <div class="col-12 col-md-2 d-flex gap-2">
                            <button type="button" id="btnCerca" class="btn btn-primary w-100">Cerca</button>
                            <a th:if="${ricercaQ != null and !ricercaQ.isEmpty()}"
                               th:href="'/front/' + ${section.id}"
                               class="btn btn-outline-secondary w-100">Tutti</a>
                        </div>

                    </div>

                    <!-- JS: costruisce URL SEO e naviga -->
                    <script th:inline="javascript">
                        (function () {
                            var pid = /*[[${section.id}]]*/ '0';

                            function cerca() {
                                var q   = document.getElementById('cerca-q').value.trim().replace(/\s+/g, '-') || '-';
                                var dal = document.getElementById('cerca-dal').value || '-';
                                var al  = document.getElementById('cerca-al').value  || '-';
                                window.location.href = '/front/' + pid + '/circolari/' + q + '/' + dal + '/' + al + '/0';
                            }

                            document.getElementById('btnCerca').addEventListener('click', cerca);
                            document.getElementById('cerca-q').addEventListener('keydown', function (e) {
                                if (e.key === 'Enter') cerca();
                            });
                        })();
                    </script>
                </div>
            </div>

            <!-- Lista circolari — usa section.contenuti, già paginato dal service -->
            <div class="row variable-gutters" th:if="${section.contenuti != null and !section.contenuti.isEmpty()}">
                <div class="col-12">
                    <div class="it-list-wrapper">
                        <ul class="it-list">
                            <th:block th:each="item : ${section.contenuti}">
                                <li>
                                    <a th:href="${item.url}" class="list-item">
                                        <div class="it-rounded-icon">
                                            <svg class="icon" aria-hidden="true"><use href="#it-file"></use></svg>
                                        </div>
                                        <div class="it-right-zone">
                                            <span class="text">
                                                <span th:text="${item.titolo}">Titolo circolare</span>
                                                <em th:if="${item.riassunto != null and !item.riassunto.isEmpty()}"
                                                    th:text="${item.riassunto}">Riassunto</em>
                                            </span>
                                            <span class="it-multiple">
                                                <span class="metadata" th:text="${item.dataVisualizzata}">Data</span>
                                            </span>
                                        </div>
                                    </a>
                                </li>
                            </th:block>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Nessun risultato -->
            <div class="row variable-gutters"
                 th:if="${section.contenuti == null or section.contenuti.isEmpty()}">
                <div class="col-12">
                    <p class="text-muted text-center py-4">Nessuna circolare trovata.</p>
                </div>
            </div>

            <!-- ============================================================
                 PAGINAZIONE — link costruiti via th:with per semplicità
                 ============================================================ -->
            <div class="row variable-gutters mt-4" th:if="${totalePagine != null and totalePagine > 1}">
                <div class="col-12 d-flex justify-content-center">

                    <!--
                        Precalcola i due prefissi URL in variabili locali:
                          urlBase    → usato quando NON c'è ricerca attiva
                          urlCerca   → usato quando c'è ricerca attiva
                        I numeri di pagina vengono appesi dopo.
                    -->
                    <th:block th:with="
                        hasCerca=${ricercaQ != null and !ricercaQ.isEmpty()},
                        qVal=${ricercaQ != null and !ricercaQ.isEmpty() ? ricercaQ : '-'},
                        dalVal=${ricercaDal != null and !ricercaDal.isEmpty() ? ricercaDal : '-'},
                        alVal=${ricercaAl != null and !ricercaAl.isEmpty() ? ricercaAl : '-'},
                        urlBase='/front/' + ${section.id} + '/',
                        urlCerca='/front/' + ${section.id} + '/circolari/' + ${qVal} + '/' + ${dalVal} + '/' + ${alVal} + '/',
                        urlPagina=${hasCerca ? urlCerca : urlBase},
                        start=${T(java.lang.Math).max(0, paginaCorrente - 2)},
                        end=${T(java.lang.Math).min(totalePagine - 1, paginaCorrente + 2)}">

                        <nav aria-label="Navigazione pagine circolari">
                            <ul class="pagination">

                                <!-- Precedente -->
                                <li class="page-item" th:classappend="${paginaCorrente == 0} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="${urlPagina + (paginaCorrente - 1)}"
                                       aria-label="Pagina precedente">
                                        <svg class="icon icon-primary" aria-hidden="true"><use href="#it-chevron-left"></use></svg>
                                        <span class="d-none d-sm-inline">Precedente</span>
                                    </a>
                                </li>

                                <!-- ... iniziale -->
                                <li class="page-item disabled" th:if="${start > 0}">
                                    <span class="page-link">…</span>
                                </li>

                                <!-- Numeri -->
                                <th:block th:each="i : ${#numbers.sequence(start, end)}">
                                    <li class="page-item" th:classappend="${i == paginaCorrente} ? 'active'">
                                        <a class="page-link"
                                           th:href="${urlPagina + i}"
                                           th:text="${i + 1}"
                                           th:attr="aria-current=${i == paginaCorrente} ? 'page' : null">1</a>
                                    </li>
                                </th:block>

                                <!-- ... finale -->
                                <li class="page-item disabled" th:if="${end < totalePagine - 1}">
                                    <span class="page-link">…</span>
                                </li>

                                <!-- Successiva -->
                                <li class="page-item" th:classappend="${paginaCorrente >= totalePagine - 1} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="${urlPagina + (paginaCorrente + 1)}"
                                       aria-label="Pagina successiva">
                                        <span class="d-none d-sm-inline">Successiva</span>
                                        <svg class="icon icon-primary" aria-hidden="true"><use href="#it-chevron-right"></use></svg>
                                    </a>
                                </li>

                            </ul>
                        </nav>
                    </th:block>

                </div>
            </div>

        </div>
    </section>

</th:block>
